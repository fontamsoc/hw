# OpenOCD (>= 0.11) adapter and tap configuration for the serial_jtag
# console bridge, matching the on-board Digilent USB-JTAG (FT2232H
# channel 0) of the Arty A7-100T and Nexys A7-100T; the values below
# are the same as OpenOCD's interface/ftdi/digilent_jtag_smt2_nc.cfg
# but kept inline so this file is self-contained.
#
# Usage (see README.md):
# 	openocd -f tools/serial_jtag/openocd_xc7.cfg
# then run openocd_bridge.py which connects to the tcl rpc port.

adapter driver ftdi
ftdi device_desc "Digilent USB Device"
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0088 0x008b
# Sample TDO on the falling TCK edge. At the top of the useable clock
# range the round-trip delay (TCK out, then TDO back through the FPGA
# and the FT2232H) eats into the rising-edge setup window and misreads
# TDO intermittently; the falling edge adds a half TCK period of margin
# and is clean across the whole 10..30 MHz range, harmless at the lower
# speeds. Without it 30 MHz is marginal, with occasional bad reads.
ftdi tdo_sample_edge falling
reset_config none

transport select jtag
# JTAG clock in kHz; the transfer rate is set entirely by the host.
# Useable range is 10000..30000 (all round-trip tested). 30000 is the
# ceiling: the on-board FT2232H tops out at a 30 MHz MPSSE clock and the
# design constrains jtag_tck to 30 MHz (create_clock -period 33.33 in
# the xdc). The FT2232H divisors are discrete, so the genuinely faster
# steps are 15000 and 30000; 20000 or 25000 run at the nearest
# achievable step below the request, 15000. Set 30000 for maximum
# throughput; the falling-edge TDO sampling set above is what keeps
# 30000 reliable. A request above 30000, such as 33000, is not a
# faster step: it programs the same divisor as 30000 and still runs
# at 30 MHz.
adapter speed 10000

# xc7a100t tap; its instruction-register is 6 bits.
jtag newtap xc7 tap -irlen 6 -ignore-version -expected-id 0x13631093

# Only the tcl rpc port is used by the bridge.
telnet_port disabled
gdb_port disabled
tcl_port 6666

init
