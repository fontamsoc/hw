# OpenOCD (>= 0.11) tap configuration for the serial_jtag console
# bridge on the orangecrab (ECP5 LFE5U-85F). The orangecrab has no
# onboard JTAG probe, hence the adapter configuration is supplied by
# the user for whichever probe is wired to the JTAG header, ie:
# 	openocd -f <your-adapter>.cfg -f tools/serial_jtag/openocd_ecp5.cfg
# then run the bridge against the ER1 (0x32) instruction:
# 	tools/serial_jtag/openocd_bridge.py --tap ecp5.tap --ir 0x32

transport select jtag

# LFE5U-85 tap; its instruction-register is 8 bits.
jtag newtap ecp5 tap -irlen 8 -ignore-version -expected-id 0x41113043

# Only the tcl rpc port is used by the bridge.
telnet_port disabled
gdb_port disabled
tcl_port 6666

init
